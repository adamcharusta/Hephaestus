# Hephaestus on Docker Engine 29 or later with Compose v2: `docker compose -f deploy/compose.yaml up -d`.
# One long-running container, `hephaestus`, hosts the orchestrator and its control API. The API listens on a Unix domain
# socket inside the container and on no network address; no port is published. The command line is the same executable,
# run inside the container:  docker exec hephaestus hephaestus version
# State lives on two named volumes: `hephaestus-data` (the SQLite database) and `hephaestus-secrets` (one file per secret).
# The secrets volume is mounted into this service alone, and the database holds only the names of the secrets.
# A third, `hephaestus-agents`, holds the Agent CLIs: at every start the host downloads what the volume lacks from each vendor,
# checks every executable against deploy/agents.lock, and places a CA certificate bundle beside them (Story 3.1). It is not state:
# an empty volume is filled again at the next start, which needs the vendors' download hosts.
# The Docker socket is mounted into this service alone (Story 3.2, AD-7): the orchestrator creates every Task's step containers through it, so it is
# root-equivalent on the host and the only container that is. A step container gets no socket, and no Task volume is ever mounted here. The process user
# is not root, so it joins the group that owns the socket: set HEPHAESTUS_DOCKER_GID to the group id of /var/run/docker.sock
# (`export HEPHAESTUS_DOCKER_GID=$(stat -c %g /var/run/docker.sock)` on Linux); 999 is the usual one.
# A fourth, `hephaestus-mirrors`, holds one bare git repository per Project (Story 3.5, AD-9): the gateway fetches into it and makes the bundle of a step's checkout from it. It is a cache that
# GitHub can fill again, it holds no credential, and only this service mounts it. Every step starts from a fresh checkout made by a container of the `hephaestus-tools` image (git only, no network, no credential),
# which the runtime fetches when the machine lacks it; the `tools` service below builds that image from this repository, and is not started by `up`: `docker compose --profile tools build`.
# Every step run gets an internal Docker network of its own and an egress proxy on it (Story 3.4, AD-7): a container of this same image running
# `hephaestus egress-proxy`, which the orchestrator creates and removes with the step. The proxy is the only way out of a step's network; it is attached to the
# `hephaestus-outbound` network, which the orchestrator also creates. This service is on neither, so no step container can reach it.
name: hephaestus

services:
  hephaestus:
    container_name: hephaestus
    # Compose builds the image from this repository on every `up` (cached when nothing changed), so the container always
    # matches the source it was started from. The release story (1.13) publishes the image and changes this to a pull.
    image: ghcr.io/adamcharusta/hephaestus:${HEPHAESTUS_IMAGE_TAG:-latest}
    pull_policy: build
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      # `en` or `pl`: the language of an installation that has set none. The installation's language is a setting of its own:
      # `hephaestus setting set language pl`.
      HEPHAESTUS_LANGUAGE: ${HEPHAESTUS_LANGUAGE:-en}
      # The value of the `hephaestus.installation` label on every container, volume, and network this installation creates. A second installation on
      # the same Docker host, such as a development one, names its own, so that neither selects the other's objects.
      HEPHAESTUS_INSTALLATION_ID: ${HEPHAESTUS_INSTALLATION_ID:-hephaestus}
      # The image the egress proxy of every step run is created from: this one, so that the proxy and the orchestrator are one release.
      HEPHAESTUS_EGRESS_PROXY_IMAGE: ghcr.io/adamcharusta/hephaestus:${HEPHAESTUS_IMAGE_TAG:-latest}
      # The image of the checkout container of every step: the tools image of the same release.
      HEPHAESTUS_TOOLS_IMAGE: ghcr.io/adamcharusta/hephaestus-tools:${HEPHAESTUS_IMAGE_TAG:-latest}
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    volumes:
      - hephaestus-data:/var/lib/hephaestus/data
      - hephaestus-secrets:/var/lib/hephaestus/secrets
      - hephaestus-agents:/var/lib/hephaestus/agents
      - hephaestus-mirrors:/var/lib/hephaestus/mirrors
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - "${HEPHAESTUS_DOCKER_GID:-999}"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      # The command line calls the control API over its socket, so a healthy container is one whose API answers.
      test: ["CMD", "hephaestus", "version", "--json"]
      interval: 15s
      timeout: 10s
      retries: 3
      # The API answers only after the first start has downloaded the Agent CLIs, about a gigabyte.
      start_period: 10m

  # Never started: it only names the build of the tools image, so that `docker compose --profile tools build` makes it where the machine has none. The release story (1.13) publishes it beside `hephaestus`.
  tools:
    profiles: ["tools"]
    image: ghcr.io/adamcharusta/hephaestus-tools:${HEPHAESTUS_IMAGE_TAG:-latest}
    pull_policy: build
    build:
      context: .
      dockerfile: tools.Dockerfile

volumes:
  hephaestus-data:
    name: hephaestus-data
  hephaestus-secrets:
    name: hephaestus-secrets
  hephaestus-agents:
    name: hephaestus-agents
  hephaestus-mirrors:
    name: hephaestus-mirrors
