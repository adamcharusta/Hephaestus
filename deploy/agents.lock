# The Agent CLIs this release of Hephaestus was tested with, and the SHA-256 of every executable (AD-8, Story 3.1).
# At every start the host reads this file, downloads what the agent binaries volume lacks from the vendor's official
# channel, verifies it, and stops unless every executable named here for the host's architecture is present and matches.
#
# One line per executable, columns separated by white space:
#   agent  version  arch  libc  file  sha256  url  [archive-sha256]
#
#   agent   claude-code or codex-cli.
#   version one version per agent, the same on every line of that agent; three numbers, a pre-release is not pinned.
#   arch    x64 or arm64.
#   libc    glibc or musl where the vendor builds per C library (Claude Code), static for a statically linked build (Codex CLI).
#   file    the executable's name in the volume: <agent>/<arch>-<libc>/<file>.
#   sha256  the executable's own digest, checked at every start. For Claude Code it is the checksum in the vendor's signed manifest.
#   url     the vendor's download address, https only.
#   archive-sha256  present when the url is a .tar.gz holding the one executable: the digest the vendor publishes for the archive.
#
# A pull request that changes this file fails the "Agent CLI pins" check unless each digest matches what the vendor publishes
# and the vendor's signature over that release verifies (eng/verify-agents-lock.py). Changing a pin also repeats the credentialed
# runs of docs/spikes/injection with the Owner's credentials (docs/agent-clis.md).
#
