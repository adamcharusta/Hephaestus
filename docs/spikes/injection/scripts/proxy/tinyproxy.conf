# tinyproxy configuration for the injection spike.
# Runs in the foreground as the image's unprivileged user and logs to stdout.
Port 3128
Listen 0.0.0.0
Timeout 600
MaxClients 100
# "Connect" logs one line per request with its target host, and nothing else.
LogLevel Connect
# HTTPS and plain HTTP only.
ConnectPort 443
ConnectPort 80
DisableViaHeader Yes
