# Builds and tests every pull request into `develop` or `main` (NFR-18, AR-76). The checks are required before a merge;
# the Owner sets that on the protected branches (docs/branching.md). SonarQube Cloud analysis is Story 1.16, not this file.
name: CI

on:
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Hephaestus.slnx

      - name: Build (warnings are errors)
        run: dotnet build Hephaestus.slnx --no-restore --configuration Release

      - name: Test with coverage
        run: >
          dotnet test --solution Hephaestus.slnx --no-build --configuration Release
          --coverlet --coverlet-output-format cobertura --results-directory TestResults

      - name: Line coverage gate (80%)
        run: python3 eng/check-coverage.py TestResults --threshold 80

      - name: License gate
        run: python3 eng/check-licenses.py

  image:
    name: Image (${{ matrix.platform }})
    # The image builds and starts on both architectures, each on a runner of its own architecture (Story 1.4): the Compose
    # file starts one container, it becomes healthy, the command line reaches the API over the socket, and nothing is
    # published or listening on a network address; a secret is a file on its own volume and not in the database or the logs (Story 1.5).
    runs-on: ${{ matrix.runner }}
    # The first start downloads the Agent CLIs (up to 15 minutes are allowed for it), and two restarts follow.
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Name the group that owns the Docker socket
        # The host runs as a user of its own and reaches the Docker socket through the socket's group (Story 3.2, deploy/compose.yaml).
        run: echo "HEPHAESTUS_DOCKER_GID=$(stat -c %g /var/run/docker.sock)" >> "$GITHUB_ENV"

      - name: Build the image
        run: |
          docker version --format 'Docker Engine {{.Server.Version}}'
          docker compose -f deploy/compose.yaml build

      - name: Start with Compose and wait until healthy
        # The first start downloads the pinned Agent CLIs from the vendors, about a gigabyte, before the API answers (Story 3.1).
        run: docker compose -f deploy/compose.yaml up -d --wait --wait-timeout 900

      - name: The first start fetched and verified every pinned executable, and the image holds none
        run: |
          # Claude Code in a glibc and a musl build, `codex` and `codex-code-mode-host`: four executables for this architecture.
          test "$(docker logs hephaestus 2>&1 | grep -c 'downloaded and verified')" -eq 4
          test "$(docker logs hephaestus 2>&1 | grep -c 'already in the volume')" -eq 0
          docker exec hephaestus test -s /var/lib/hephaestus/agents/certs/ca-certificates.crt
          image="$(docker inspect --format '{{.Config.Image}}' hephaestus)"
          # Started without the volume, the image holds no executable of an Agent and no file as large as one.
          found="$(docker run --rm --user 0 --entrypoint sh "$image" -c 'find / -xdev -type f \( -name claude -o -name codex -o -name codex-code-mode-host -o -size +200M \) -print')"
          echo "files that look like an Agent binary in the image: [$found]"
          test -z "$found"
          test -z "$(docker run --rm --user 0 --entrypoint sh "$image" -c 'ls -A /var/lib/hephaestus/agents')"

      - name: Each pinned executable starts in a hardened container and prints its version
        run: bash eng/check-agent-binaries.sh hephaestus-agents

      - name: A second start downloads nothing
        run: |
          mark="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          docker compose -f deploy/compose.yaml restart
          docker compose -f deploy/compose.yaml up -d --wait --wait-timeout 300
          after="$(docker logs --since "$mark" hephaestus 2>&1)"
          test "$(grep -c 'already in the volume' <<< "$after")" -eq 4
          test "$(grep -c 'downloaded and verified' <<< "$after" || true)" -eq 0
          # The certificate bundle is replaced at every start, and the volume holds nothing the lock does not name.
          volume_dir=/var/lib/hephaestus/agents
          docker exec hephaestus sh -c "touch $volume_dir/stray && rm $volume_dir/certs/ca-certificates.crt && printf x > $volume_dir/certs/ca-certificates.crt"
          mark="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          docker compose -f deploy/compose.yaml restart
          docker compose -f deploy/compose.yaml up -d --wait --wait-timeout 300
          docker exec hephaestus test ! -e "$volume_dir/stray"
          test "$(docker exec hephaestus grep -c 'BEGIN CERTIFICATE' "$volume_dir/certs/ca-certificates.crt")" -gt 10

      - name: The command line reaches the API
        run: |
          docker exec hephaestus hephaestus version
          docker exec hephaestus hephaestus version --json | python3 -c 'import json, sys; assert list(json.load(sys.stdin)) == ["version"]'
          set +e
          docker exec hephaestus hephaestus frobnicate
          test "$?" -eq 2

      - name: No port is published and nothing listens on a network address
        run: |
          published="$(docker port hephaestus || true)"
          echo "published ports: [$published]"
          test -z "$published"
          # Docker's embedded DNS resolver (127.0.0.11, 0B00007F in /proc/net) listens in every container on a user-defined network.
          tcp="$(docker exec hephaestus cat /proc/net/tcp /proc/net/tcp6 | awk '$4 == "0A" && $2 !~ /^0B00007F:/')"
          echo "listening tcp sockets: [$tcp]"
          test -z "$tcp"
          udp="$(docker exec hephaestus cat /proc/net/udp /proc/net/udp6 | awk '$4 == "07" && $2 !~ /^0B00007F:/')"
          echo "bound udp sockets: [$udp]"
          test -z "$udp"

      - name: The host runs as a non-root user and owns a socket only it can open
        run: |
          test "$(docker exec hephaestus id -u)" -ne 0
          test "$(docker exec hephaestus stat -c %a /run/hephaestus/control.sock)" = 600

      - name: The Docker socket is mounted into this container only, and the container holds nothing else of the host
        run: |
          # Only this container holds the Docker socket, and the host process can use it as the user it runs as (Story 3.2, AD-7).
          test "$(docker ps -a --filter volume=/var/run/docker.sock --format '{{.Names}}')" = hephaestus
          docker exec hephaestus test -S /var/run/docker.sock
          docker exec hephaestus test -r /var/run/docker.sock
          docker exec hephaestus test -w /var/run/docker.sock
          # Its mounts are the socket and its own three volumes: no other host path and no Task volume (`hephaestus-ws-<task-id>`).
          actual="$(docker inspect --format '{{range .Mounts}}{{.Type}}|{{.Name}}|{{.Destination}}{{println}}{{end}}' hephaestus | grep -v '^$' | sort)"
          expected="$(printf '%s\n' 'bind||/var/run/docker.sock' 'volume|hephaestus-agents|/var/lib/hephaestus/agents' 'volume|hephaestus-data|/var/lib/hephaestus/data' 'volume|hephaestus-secrets|/var/lib/hephaestus/secrets' | sort)"
          echo "mounts of the hephaestus container:"; echo "$actual"
          test "$actual" = "$expected"

      - name: A secret is a file on the secrets volume and its name is in the database
        run: |
          value='sk-ci-0123456789-abcdefghij'
          printf '%s\n' "$value" | docker exec -i hephaestus hephaestus secret set ci-secret
          docker exec hephaestus hephaestus secret list --json | python3 -c 'import json, sys; assert json.load(sys.stdin) == {"secrets": [{"name": "ci-secret"}]}'
          test "$(docker exec hephaestus cat /var/lib/hephaestus/secrets/ci-secret)" = "$value"
          test "$(docker exec hephaestus stat -c %a /var/lib/hephaestus/secrets/ci-secret)" = 600
          test "$(docker exec hephaestus stat -c %a /var/lib/hephaestus/secrets)" = 700
          # The database file is in write-ahead-log mode: bytes 18 and 19 of its header are both 2.
          test "$(docker exec hephaestus od -An -tu1 -j18 -N2 /var/lib/hephaestus/data/hephaestus.db | tr -s ' ' | xargs)" = "2 2"
          # A value given as an argument is refused, with exit code 2, and nothing is stored.
          code=0; docker exec hephaestus hephaestus secret set ci-argument "$value" || code=$?
          test "$code" -eq 2
          docker exec hephaestus hephaestus secret list --json | python3 -c 'import json, sys; assert json.load(sys.stdin) == {"secrets": [{"name": "ci-secret"}]}'

      - name: The value is in no database file and no log line, and only this container mounts the secrets volume
        run: |
          value='sk-ci-0123456789-abcdefghij'
          code=0; docker exec hephaestus grep -rqF -- "$value" /var/lib/hephaestus/data || code=$?
          test "$code" -eq 1
          code=0; docker logs hephaestus 2>&1 | grep -qF -- "$value" || code=$?
          test "$code" -eq 1
          test "$(docker ps -a --filter volume=hephaestus-secrets --format '{{.Names}}')" = hephaestus
          test "$(docker ps -a --filter volume=hephaestus-data --format '{{.Names}}')" = hephaestus

      - name: Secrets survive a restart and a removal takes the file and the name
        run: |
          value='sk-ci-0123456789-abcdefghij'
          docker compose -f deploy/compose.yaml restart
          docker compose -f deploy/compose.yaml up -d --wait --wait-timeout 120
          docker exec hephaestus hephaestus secret list --json | python3 -c 'import json, sys; assert json.load(sys.stdin) == {"secrets": [{"name": "ci-secret"}]}'
          test "$(docker exec hephaestus cat /var/lib/hephaestus/secrets/ci-secret)" = "$value"
          docker exec hephaestus hephaestus secret remove ci-secret
          docker exec hephaestus hephaestus secret list --json | python3 -c 'import json, sys; assert json.load(sys.stdin) == {"secrets": []}'
          docker exec hephaestus test ! -e /var/lib/hephaestus/secrets/ci-secret

      - name: The language reaches the command line
        run: |
          docker exec -e HEPHAESTUS_LANGUAGE=pl hephaestus hephaestus version | grep -q 'Hephaestus w wersji'
          docker exec hephaestus hephaestus version | grep -q 'Hephaestus version'
          docker exec hephaestus hephaestus setting set language pl
          docker exec hephaestus hephaestus version | grep -q 'Hephaestus w wersji'
          docker exec hephaestus hephaestus setting set language en
          docker exec hephaestus hephaestus version | grep -q 'Hephaestus version'

      - name: Logs are JSON objects, one per line
        run: docker logs hephaestus 2>/dev/null | python3 -c 'import json, sys; lines = sys.stdin.read().splitlines(); assert lines; [json.loads(l) for l in lines]'

      - name: Show the logs and stop
        if: always()
        run: |
          docker compose -f deploy/compose.yaml logs --no-color || true
          docker compose -f deploy/compose.yaml down --volumes

  agent-pins:
    name: Agent CLI pins
    # A pull request that changes deploy/agents.lock fails unless each digest is the one the vendor publishes and the vendor's signature over
    # that release verifies (Story 3.1, AD-8). The job runs for every pull request, so that it can be a required check, and does its work
    # only when the lock or the script that checks it changes; a job that does nothing counts as passed.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Find out whether the pins change
        id: changed
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
        run: |
          files="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PULL_REQUEST}/files" --paginate --jq '.[].filename')"
          if grep -qxE 'deploy/agents.lock|eng/verify-agents-lock.py' <<< "$files"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "deploy/agents.lock is not changed by this pull request."
          fi

      - name: Check out
        if: steps.changed.outputs.changed == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install cosign
        if: steps.changed.outputs.changed == 'true'
        uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4
        with:
          cosign-release: v3.1.6

      - name: Digests match what the vendors publish and their signatures verify
        if: steps.changed.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 eng/verify-agents-lock.py

  gate-scripts:
    name: Gate scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test the coverage and license gates
        run: python3 -m unittest discover -s eng -p "test_*.py" -v

  branch-policy:
    name: Branch policy
    # `main` receives only `develop` or a `hotfix/*` branch of this repository (AR-76). A job skipped by its condition
    # counts as passed for a required check, so this one never blocks a pull request into `develop`.
    if: github.base_ref == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Allow only develop or hotfix branches into main
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPOSITORY: ${{ github.repository }}
        run: |
          if [ "$HEAD_REPOSITORY" != "$BASE_REPOSITORY" ]; then
            echo "A pull request into main must come from a branch of this repository, not from $HEAD_REPOSITORY." >&2
            exit 1
          fi
          case "$HEAD_REF" in
            develop | hotfix/*) echo "$HEAD_REF may be merged into main." ;;
            *) echo "A pull request into main must come from develop or a hotfix/* branch, not from $HEAD_REF." >&2; exit 1 ;;
          esac
