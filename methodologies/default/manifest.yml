# The built-in Methodology. It ships in the Hephaestus image, so a Project that selects none, or selects `default`,
# names a Methodology that exists. An instruction template is a file named after its step kind, `<step kind>.md`; this
# one holds the `Implementation` template (Story 3.11), and a template for another kind is added by the story that first needs it.
name: default
description: Plain role prompts, one per Agent step kind. The same instructions go to whichever Agent performs the step.
